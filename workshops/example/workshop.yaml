id: example
title: "Example Workshop"
status: available
repo: learning-with-court/workshop-template
tagline: "A minimal forkable workshop scaffold — replace this with your first real lesson."
summary: |
  This example workshop ships with the workshop-template repo. It demonstrates
  the unified compose layout: a single workshop under workshops/example/ with
  one lesson. Fork the template, rename this directory, and fill in your content.
difficulty: beginner
tags:
  - example
  - template
install: "set up the example workshop"
youWillBuild:
  - "A TypeScript module that exports a typed function."
  - "Verified passing tests using the pre-shipped vitest suite."
# kind: claude-code, git, node (with version: <major>), gh or uv is installed
# by lwc if missing and listed under "Done for you". kind: need (or no kind) is
# what the learner brings, listed under "You'll need". The kinds come from
# scripts/prerequisite.schema.json (pnpm sync:prereq-schema).
prerequisites:
  - term: "Claude Code"
    kind: claude-code
    desc: "The agent that walks the lessons with you."
  - term: "Node 22"
    kind: node
    version: 22
    desc: "Runs the lesson's tests."
  - term: "TypeScript basics"
    kind: need
    desc: "Familiarity with exporting functions from a TypeScript module."
phases:
  - id: A
    title: Getting started
    lessons:
      - example
