id: example
title: "Your first function"
blurb: "Read a test, have Claude write the one function it asks for, and watch it run."
prerequisites: []
targetFiles:
  - src/example.ts
verifyCommand: "pnpm exec vitest run src/example.test.ts || true"
verify:
  description: |
    Runs the behavioral vitest test for example.ts. The test imports `example` from
    ./example.ts and asserts example() returns the expected string. A passing run
    prints "Tests  2 passed"; a missing export or wrong return value prints a failure.
    Each check is named in plain words, since the lesson's recap shows the names.
  mustInclude:
    - "Tests "
  mustNotInclude:
    - "Cannot find module"
# Optional `try:` block — declares a live single-call demo for `pnpm try`.
# `verify` runs the lesson's tests; `try` runs the deliverable ONCE on a fixture so
# the learner can see real output. `scripts/try.ts` resolves the active lesson from
# local state, imports `export` from `src/<module>.ts`, feeds it the fixture (as the
# first argument), and prints the result. Only declare it for lessons with a live demo.
try:
  module: example          # → src/example.ts
  export: example          # the named export to call
  fixture: fixtures/sample.json   # relative to .workshop/<ws>/lesson_example/
  fixtureAs: json          # "json" (parsed object, default) | "text" (raw string)
# One entry per README Walkthrough item, in order: what the lesson page shows
# beside the step, and, for a choose step, the buttons and the prompt each sends.
# A view (`file <path>`, `commits`, or `move <from> <to>`) is drawn from the
# practice repo named in .lwc/target-repo, never from this clone, so this
# lesson, whose work lands in this clone's src/, gives every step `{}`.
# A workshop with a practice repo writes, for example, `- view: file src/greet.js`.
# `pnpm lint-manifest` checks the list against the README (scripts/lint-steps.ts).
steps:
  - {}                               # 1 read the test
  - choices:                         # 2 choose what the greeting says
      - label: "Hello from example!"
        prompt: "I think the greeting must be \"Hello from example!\" with the exclamation mark. Am I right?"
      - label: "Hello from example"
        prompt: "I think the greeting must be \"Hello from example\" with no exclamation mark. Am I right?"
      - label: "Any greeting will do"
        prompt: "I think any greeting will do, as long as it says hello. Am I right?"
  - {}                               # 3 write the function
  - {}                               # 4 watch it run
onPass:
  feedback: |
    You've built and verified a typed exported function. The compose model
    delivered this lesson's starting tree — the test was pre-shipped, you
    wrote the implementation, and vitest confirmed the contract.
    Replace this lesson with your first real lesson.
