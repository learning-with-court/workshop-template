name: manifest-lint
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint-manifest
      # Keeps notebook-base/mechanics.reference.yaml honest. It is the file
      # authors copy, so if it stops passing its own linter every notebook
      # workshop scaffolded from it starts out broken.
      - run: pnpm lint-notebook-mechanics
      - run: pnpm test:scripts
