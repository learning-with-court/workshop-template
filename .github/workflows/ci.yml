name: ci
on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  scripts:
    name: scripts + typecheck
    # The org variable LWC_RUNNER (lwc-small, private repos only) sends private
    # workshops to the shared runner set; workshop-template, public, has no
    # variable and runs on GitHub-hosted runners.
    runs-on: ${{ vars.LWC_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      # On the shared runners plain python3 is Amazon Linux's older system Python; setup-python finds the 3.12 baked into the runner image.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:scripts
      - run: pnpm typecheck
